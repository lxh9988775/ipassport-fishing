function rollEquip(minRar){const sk=['w','a','t'][ri(0,2)];const sl=EQ_SLOTS[sk];
  let rar=rollRarity();if(rar<minRar)rar=minRar;if(Math.random()<0.25)rar=Math.min(RARITY.length-1,rar+1);
  const it={slot:sk,rar,name:sl.names[Math.min(rar,sl.names.length-1)]};
  if(sk==='w')it.atk=(rar+1)*6;if(sk==='a')it.def=(rar+1)*3;if(sk==='t')it.pow=1+0.12*(rar+1);/* 装备加成加重：没装备打章节 BOSS 会非常吃力（装备门禁） */
  return it;}

function normalizeState(s){
  /* 兜底入口：存档根本不是对象（null/字符串/数字）→ 全新档 */
  if(s==null||typeof s!=='object'||Array.isArray(s))s={};
  /* NaN / 缺失数值兜底（旧版本 bug 可能已把 NaN 写进存档） */
  ['hp','mp','maxHp','maxMp','gold','level','rank','kills','exp','herbs','mats','crystals','orbs','potions','atkBonus','seals'].forEach(k=>{if(typeof s[k]!=='number'||!isFinite(s[k]))s[k]=0;});
  if(s.maxHp<=0)s.maxHp=50;if(s.maxMp<=0)s.maxMp=30;if(s.level<=0)s.level=1;
  const d=newState();
  /* 关键：null 和 undefined 一律回填默认值（旧档可能存有 null——JSON 把 NaN 序列化成 null 的历史遗留）。
     equip 槽位/副本报价 dungeOffers 等本身合法为 null 的字段不受影响：它们在 d 里的默认值就是 null 或后文有专门检查 */
  for(const k in d){if(s[k]===undefined||s[k]===null)s[k]=d[k];}
  if(typeof s.name!=='string')s.name='';
  if(!s.map||typeof s.map!=='object'||Array.isArray(s.map))s.map={chapter:0,layer:0};
  if(typeof s.map.chapter!=='number'||!isFinite(s.map.chapter))s.map.chapter=0;
  if(typeof s.map.layer!=='number'||!isFinite(s.map.layer))s.map.layer=0;
  if(s.discovered==null||typeof s.discovered!=='object'||Array.isArray(s.discovered))s.discovered=d.discovered;
  if(!s.discovered['0-0-0'])s.discovered['0-0-0']='火弹';
  if(!s.discovered['0-1-0'])s.discovered['0-1-0']='水弹';
  if(!s.discovered['0-2-0'])s.discovered['0-2-0']='雷弹';
  if(!s.equipped||!s.discovered[s.equipped])s.equipped='0-0-0';
  if(!Array.isArray(s.loadout))s.loadout=['0-0-0','0-1-0','0-2-0'];
  s.loadout=s.loadout.filter(k=>s.discovered[k]);
  if(s.loadout.length===0)s.loadout=[s.equipped||'0-0-0'];
  if(s.loadout.indexOf(s.equipped)<0)s.equipped=s.loadout[0];
  if(!s.dex||typeof s.dex!=='object')s.dex={seen:{},caught:{}};
  if(!s.dex.seen)s.dex.seen={};if(!s.dex.caught)s.dex.caught={};
  /* 伙伴数组元素必须是合法对象：脏档可能存有 null/数字元素（曾致 .type 裸读崩溃） */
  if(!Array.isArray(s.partners))s.partners=[];
  s.partners=s.partners.filter(p=>p&&typeof p==='object'&&!Array.isArray(p));
  s.partners.forEach(p=>{if(!p.type)p.type='cat';if(!p.skill)p.skill='claw';if(!p.trait)p.trait='tough';if(p.evolved===undefined)p.evolved=false;if(p.exp===undefined)p.exp=0;if(!p.ivs)p.ivs=[10,10,10];});
  /* 出战位越界收敛：放生/坏档后 activePartner 指向空位 → 伙伴永远站桩不出手的真凶 */
  if(!Array.isArray(s.partners))s.partners=[];
  if(s.activePartner==null||typeof s.activePartner!=='number'||!isFinite(s.activePartner))s.activePartner=0;
  if(s.activePartner<0||s.activePartner>=s.partners.length)s.activePartner=0;
  if(!s.equip||typeof s.equip!=='object')s.equip={w:null,a:null,t:null};
  ['w','a','t'].forEach(k=>{if(!(k in s.equip))s.equip[k]=null;});
  if(!Array.isArray(s.ebag))s.ebag=[];
  /* 装备条目必须是带合法 slot/rar 的对象（脏档可能存 null 或缺字段 → RARITY[undefined] 崩溃） */
  s.ebag=s.ebag.filter(it=>it&&typeof it==='object'&&!Array.isArray(it)&&['w','a','t'].indexOf(it.slot)>=0);
  s.ebag.forEach(it=>{if(typeof it.rar!=='number'||!isFinite(it.rar)||it.rar<0||it.rar>3)it.rar=0;if(typeof it.name!=='string')it.name='神秘装备';});
  /* 已装备的三个槽位同样净化 rar/name（EQUIP 界面裸读 RARITY[it.rar].c） */
  if(!s.equip||typeof s.equip!=='object')s.equip={w:null,a:null,t:null};
  ['w','a','t'].forEach(k=>{const it=s.equip[k];if(it==null||typeof it!=='object'||Array.isArray(it)){s.equip[k]=null;return;}
    if(['w','a','t'].indexOf(it.slot)<0)it.slot=k;
    if(typeof it.rar!=='number'||!isFinite(it.rar)||it.rar<0||it.rar>3)it.rar=0;
    if(typeof it.name!=='string')it.name='神秘装备';});
  /* 魔法合成槽 spell = [形态,元素,阶级] 三个界内下标（脏值 → FORMS[NaN].n 崩溃） */
  if(!Array.isArray(s.spell)||s.spell.length!==3)s.spell=[0,0,0];
  const spBounds=[FORMS.length,ELEMS.length,MODS.length];
  for(let i=0;i<3;i++){const v=s.spell[i];s.spell[i]=(typeof v==='number'&&isFinite(v))?Math.min(spBounds[i]-1,Math.max(0,Math.floor(v))):0;}
  if(!s.bossKilled||typeof s.bossKilled!=='object')s.bossKilled={};
  if(!s.storySeen||typeof s.storySeen!=='object')s.storySeen={};
  if(!s.pbag||typeof s.pbag!=='object')s.pbag={};
  if(!s.mbag||typeof s.mbag!=='object')s.mbag={};
  if(!Array.isArray(s.stones))s.stones=[];/* 魔石下标 1~4（古代=4），数组必须 5 格：旧版截成 4 格导致 stones[4]=undefined→NaN→存档变 null 的连环崩 */
  for(let i=0;i<5;i++){const v=s.stones[i];s.stones[i]=(typeof v==='number'&&isFinite(v)&&v>0)?Math.floor(v):0;}
  if(!s.spellLv||typeof s.spellLv!=='object'||Array.isArray(s.spellLv))s.spellLv={};
  for(const k in s.spellLv){const v=s.spellLv[k];if(typeof v!=='number'||!isFinite(v))s.spellLv[k]=0;else if(v<0)s.spellLv[k]=0;}
  [s.pbag,s.mbag].forEach(b=>{if(b)for(const k in b){const v=b[k];if(typeof v!=='number'||!isFinite(v)||v<0)b[k]=0;}});
  /* 副本报价必须是界内数字 id 数组（脏档可能存 null/越界元素 → DUNGEONS[id].kind 裸读崩溃） */
  if(!Array.isArray(s.dungeonOffers))s.dungeonOffers=null;
  if(s.dungeonOffers){s.dungeonOffers=s.dungeonOffers.filter(id=>typeof id==='number'&&isFinite(id)&&id>=0&&id<DUNGEONS.length).map(id=>Math.floor(id));if(s.dungeonOffers.length===0)s.dungeonOffers=null;}
  return s;
}

/* 安全读取：魔法等级 / 魔石数量——存档脏值（null/NaN/undefined）一律按 0，杜绝 "Cannot read properties of null" */
function slv(k){return (state.spellLv&&typeof state.spellLv[k]==='number'&&isFinite(state.spellLv[k]))?state.spellLv[k]:0;}
function slvSet(k,v){if(!state.spellLv||typeof state.spellLv!=='object'||Array.isArray(state.spellLv))state.spellLv={};state.spellLv[k]=v;}
function stoneN(i){return (Array.isArray(state.stones)&&typeof state.stones[i]==='number'&&isFinite(state.stones[i]))?Math.max(0,Math.floor(state.stones[i])):0;}
function spellName(key){const a=key.split('-').map(Number);return MODS[a[2]].pre+ELEMS[a[1]].n+FORMS[a[0]].n;}
function spellPower(key){const a=key.split('-').map(Number);const f=FORMS[a[0]],el=ELEMS[a[1]],m=MODS[a[2]];return Math.round((9+state.level*3+state.rank*5)*f.pow*el.pow*m.pow*(1+0.15*slv(key)));}
function spellCost(key){const a=key.split('-').map(Number);const tier=a[2]||0;return Math.round(3*FORMS[a[0]].pow*MODS[a[2]].cost+tier*8);/* 阶级越高耗魔越夸张：初级3 → 古代弹 39+，低等级"学得起放不起" */}
function spellElem(key){return ELEMS[key.split('-').map(Number)[1]].c;}
function activeLoadout(){const lo=(state.loadout||[]).filter(k=>state.discovered[k]);return lo.length?lo:[state.equipped||'0-0-0'];}
function spellDesc(key){const a=key.split('-').map(Number);return FORMS[a[0]].des+'·'+ELEMS[a[1]].n+'属性·'+MODS[a[2]].des;}
function expNeed(){return Math.round(16+state.level*11);/* 升级曲线放慢 ~1.8 倍：升级要靠副本/BOSS 的额外经验撑，而不是无脑平刷 */}
function promoteReady(){return state.rank<RANKS.length-1 && state.kills>=RANK_KILLS[state.rank] && state.questDone>=state.rank+1;}

  tone(freq,dur,type,vol,slide){if(!state||!state.sound||!this.ctx)return;const t=this.ctx.currentTime;const o=this.ctx.createOscillator(),g=this.ctx.createGain();o.type=type||'square';o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+dur);g.gain.setValueAtTime((vol||0.12),t);g.gain.exponentialRampToValueAtTime(0.001,t+dur);o.connect(g).connect(this.ctx.destination);o.start(t);o.stop(t+dur);},
  move(){this.tone(420,0.05,'square',0.06);},
  confirm(){this.tone(720,0.06,'square',0.09);},cancel(){this.tone(220,0.08,'square',0.07);},

function drawHero(x,footY,t,hurt){
  x=x|0;const step=Math.sin(t*8);const bob=Math.abs(step)>0.7?-1:0;footY=(footY+bob)|0;

/* ---- 参数化立绘：按 ENEMY[type].art 配置画出八方旅人风像素怪（脚底 = footY） ----
   art: {shape:'blob|quad|biped|float', c:主色, c2:暗部, eye:瞳色, ear:0/1/2, horn:0/1/2, wing:0/1, tail:0/1, sz:可选体型0.8~1.2}
   ═══ 怪物立绘底层规范（永久生效，加新怪只准填 art 字段，严禁绕过本函数另画） ═══
   ① 锚点统一：x=水平中心，footY=接地面，四种 shape 共用同一地平线；
   ② 包围盒统一：身体宽≤34 高≤34，配件（耳/角/翼）默认体型下最高到 footY-46；sz 放大时整体等比，不会单个配件失控；
   ③ 接地统一：地面系怪脚底恰好踩 footY，脚下统一椭圆投影；float 固定悬浮+随高度缩放的投影；
   ④ 光影统一：描边=主色-55%，暗面=-35%，受光面=+30%，眼底高光 #fff；
   ⑤ 比例统一：身体尺寸由 MOB_SHAPE_SPEC 按形状锁定，眼睛恒在头部上 1/3；
   ⑥ 动画统一：呼吸幅度 4%，相位按主色哈希错开（同屏不会齐刷刷起伏）。 */
function mobShade(c,f){c=c.replace('#','');let r=parseInt(c.slice(0,2),16),g=parseInt(c.slice(2,4),16),b=parseInt(c.slice(4,6),16);if(f>=0){r=Math.round(r+(255-r)*f);g=Math.round(g+(255-g)*f);b=Math.round(b+(255-b)*f);}else{r=Math.round(r*(1+f));g=Math.round(g*(1+f));b=Math.round(b*(1+f));}return 'rgb('+r+','+g+','+b+')';}
/* 形状规范表：bw=体宽 bh=体高 top=立绘顶距脚底（含头/悬浮）。加新 shape 必须先在此登记，否则回落 biped */
const MOB_SHAPE_SPEC={
  blob :{bw:22,bh:26,top:26},
  float:{bw:18,bh:20,top:22,hover:8},
  quad :{bw:18,bh:14,top:25},
  biped:{bw:14,bh:16,top:27}
};
function drawMobArt(art,x,footY,t){
  x=x|0;footY=footY|0;
  const c=art.c||'#999',c2=art.c2||mobShade(c,-0.35),eye=art.eye||'#222';
  const spec=MOB_SHAPE_SPEC[art.shape]||MOB_SHAPE_SPEC.biped;
  const S=Math.max(0.75,Math.min(1.25,art.sz||1)); /* 规范②：体型钳制 0.75~1.25 */
  const ph=((c.charCodeAt(1)||3)*7+(c.charCodeAt(3)||5)*13)%628/100; /* 规范⑥：相位哈希 */
  const br=1+Math.sin(t*4+ph)*0.04;
  const W2=spec.bw/2,BH=spec.bh;
  const hov=spec.hover?(spec.hover+Math.sin(t*2.3+ph)*2):0; /* 规范③：float 悬浮高度固定带浮动 */
  /* 规范③：统一椭圆接地投影（float 随悬浮高度缩小投影） */
  ctx.fillStyle='rgba(0,0,0,.30)';
  ctx.beginPath();ctx.ellipse(x,footY-1,W2*0.62*S*(spec.hover?Math.max(0.5,1-hov/18):1),3*S,0,0,6.28);ctx.fill();
  ctx.save();ctx.translate(x,footY-hov);ctx.scale(S,S*br);
  const OL=mobShade(c,-0.55),HI=mobShade(c,0.30);
  /* 头顶锚点：blob/float=身体顶(-BH)；quad/biped=头顶(-top)。耳/角/翼全挂这里，保证横向对齐 */
  const hT=(art.shape==='blob'||art.shape==='float')?-BH:-spec.top;
  if(art.shape==='blob'){
    ctx.fillStyle=OL;ctx.beginPath();ctx.ellipse(0,-BH/2-0.5,W2+1,BH/2+1,0,0,6.28);ctx.fill();
    ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(0,-BH/2,W2,BH/2,0,0,6.28);ctx.fill();
    ctx.fillStyle=HI;ctx.beginPath();ctx.ellipse(-W2*0.28,-BH*0.68,W2*0.42,BH*0.26,0,0,6.28);ctx.fill();
    ctx.fillStyle=c2;px(-W2+1,-4,W2*2-2,3);
  }else if(art.shape==='float'){
    ctx.fillStyle=OL;ctx.beginPath();ctx.ellipse(0,-BH/2-0.5,W2,BH/2+1,0,0,6.28);ctx.fill();
    ctx.fillStyle=c;ctx.beginPath();ctx.ellipse(0,-BH/2,W2-1,BH/2,0,0,6.28);ctx.fill();
    ctx.fillStyle=HI;px(-W2*0.5|0,-BH*0.72|0,4,5);
    px(-3,-2,2,3,c2);px(1,-2,2,3,c2); /* 底部小须 */
  }else if(art.shape==='quad'){
    const bT=hT+8; /* 身体顶 */
    ctx.fillStyle=c;px(W2-4,hT,9,9);                    /* 头（右前） */
    ctx.fillStyle=mobShade(c,-0.4);px(W2+4,hT+2,2,4);   /* 吻部暗面 */
    ctx.fillStyle=OL;px(-W2-1,bT-1,W2*2+2,BH-2);        /* 身体描边 */
    ctx.fillStyle=c;px(-W2,bT,W2*2,BH-4);               /* 身体 */
    ctx.fillStyle=c2;px(-W2,-6,W2*2,3);                 /* 腹部暗面 */
    ctx.fillStyle=HI;px(-W2,bT,W2*2,3);                 /* 背部受光 */
    ctx.fillStyle=mobShade(c,-0.3);px(-W2+1,-4,3,4);px(W2-4,-4,3,4); /* 腿（踩地） */
  }else{ /* biped 双足 */
    const bT=-BH-2;
    ctx.fillStyle=OL;px(-W2-1,bT-1,W2*2+2,BH);          /* 身体描边 */
    ctx.fillStyle=c;px(-W2,bT,W2*2,BH-3);               /* 身体 */
    ctx.fillStyle=c2;px(-W2,-6,W2*2,3);                 /* 腹部暗面 */
    ctx.fillStyle=HI;px(-W2,bT,W2*2,3);                 /* 肩部受光 */
    ctx.fillStyle=OL;px(-W2-2,hT,W2*2+4,10);            /* 头描边 */
    ctx.fillStyle=c;px(-W2-1,hT+1,W2*2+2,8);            /* 头 */
    ctx.fillStyle=HI;px(-W2,hT+2,W2*2,3);
    ctx.fillStyle=mobShade(c,-0.3);px(-W2+1,-4,3,4);px(W2-4,-4,3,4); /* 腿（踩地） */
  }
  /* 耳（锚点=头顶 hT，左右对称） */
  if(art.ear===1){ctx.fillStyle=mobShade(c,-0.2);tri(-5,hT,4,6);tri(5,hT,4,6);}
  else if(art.ear===2){ctx.fillStyle=mobShade(c,-0.2);tri(-6,hT-2,6,9);tri(6,hT-2,6,9);ctx.fillStyle=mobShade(c,0.25);tri(-5,hT-1,3,5);tri(5,hT-1,3,5);}
  /* 角 */
  if(art.horn===1){ctx.fillStyle='#e8e0c8';px(-3,hT-6,2,6);px(2,hT-6,2,6);}
  else if(art.horn===2){ctx.fillStyle='#e8e0c8';tri(-4,hT-6,4,9);tri(3,hT-6,4,9);}
  /* 背翼（在身体后，翼尖最高 hT-13，规范②内） */
  if(art.wing){
    ctx.fillStyle=mobShade(c,-0.5);tri(0,hT+5,13,17);tri(0,hT+5,-13,17);
    ctx.fillStyle=mobShade(c,0.25);tri(0,hT+7,9,13);tri(0,hT+7,-9,13);
  }
  /* 尾（锚点=身体左下，贴地） */
  if(art.tail){ctx.fillStyle=mobShade(c,-0.2);if(art.shape==='quad'){px(-W2-3,-BH*0.55,4,3);px(-W2-5,-BH*0.55-2,3,5);}else{px(-W2-1,-BH*0.4,4,3);px(-W2-3,-BH*0.4-3,3,4);}}
  /* 眼（规范⑤：恒在头部上 1/3；quad 眼随头偏右） */
  const eyY=art.shape==='quad'||art.shape==='biped'?hT+4:-BH*0.65;
  const ex=art.shape==='quad'?W2+1:0;
  ctx.fillStyle=eye;px(-3+ex,eyY,2,2);px(2+ex,eyY,2,2);

  if(art.shape!=='blob'&&art.shape!=='float'){ctx.fillStyle=mobShade(c,-0.4);px(ex-1,eyY+4,3,1);}
  ctx.restore();
}

const Assets={};
/* 抠洋红底：采样四角底色 → 距离透明化（软边） → 裁剪内容包围盒；失败则回退原图 */
function processSprite(img){
  try{
    const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
    const g=c.getContext('2d');g.drawImage(img,0,0);
    g.fillStyle='#ff00ff';g.fillRect(c.width*0.55,c.height*0.87,c.width*0.45,c.height*0.13);/* 抹掉右下角水印 */
    const d=g.getImageData(0,0,c.width,c.height);const p=d.data;const cw=c.width,ch=c.height;
    let r=0,gr=0,b=0;[[2,2],[cw-3,2],[2,ch-3],[cw-3,ch-3]].forEach(([x,y])=>{const i=(y*cw+x)*4;r+=p[i];gr+=p[i+1];b+=p[i+2];});r/=4;gr/=4;b/=4;
    let minX=cw,minY=ch,maxX=0,maxY=0;
    for(let y=0;y<ch;y++)for(let x=0;x<cw;x++){const i=(y*cw+x)*4;
      const dist=Math.sqrt((p[i]-r)*(p[i]-r)+(p[i+1]-gr)*(p[i+1]-gr)+(p[i+2]-b)*(p[i+2]-b));
      if(dist<95)p[i+3]=0;else if(dist<145)p[i+3]=Math.round(255*(dist-95)/50);
      if(p[i+3]>20){if(x<minX)minX=x;if(x>maxX)maxX=x;if(y<minY)minY=y;if(y>maxY)maxY=y;}}
    g.putImageData(d,0,0);
    const pad=3;minX=Math.max(0,minX-pad);minY=Math.max(0,minY-pad);maxX=Math.min(cw-1,maxX+pad);maxY=Math.min(ch-1,maxY+pad);
    const t=document.createElement('canvas');t.width=maxX-minX+1;t.height=maxY-minY+1;
    t.getContext('2d').drawImage(c,minX,minY,t.width,t.height,0,0,t.width,t.height);
    return t;
  }catch(e){return img;}
}
/* 把图片右下角水印用左侧同尺寸区块盖掉（背景图用） */
function patchMark(img){
  try{
    const c=document.createElement('canvas');c.width=img.width;c.height=img.height;
    const g=c.getContext('2d');g.drawImage(img,0,0);
    const w=Math.round(c.width*0.28),h=Math.round(c.height*0.12),x=c.width-w,y=c.height-h;
    g.drawImage(c,x-w,y,w,h,x,y,w,h);
    return c;
  }catch(e){return img;}
}

  const list=[['hero','assets/hero.png'],['catspirit','assets/catspirit.png'],['goblin','assets/goblin.png'],['titleArt','assets/title_art.png'],['townArt','assets/town_art.png']];

/* 画立绘：锚点为脚底中心；sx>0 水平挤压（弹跳落地感），kx>0 击退/突进倾斜，失败返回 false 走代码兜底 */
function drawSprite(key,x,footY,hPix,squash,tilt){
  const s=Assets[key];if(!s)return false;
  const sq=squash||1;
  const w=hPix*(s.width/s.height)/sq;
  const h=hPix*sq;
  ctx.save();
  ctx.translate(x,footY);
  if(tilt)ctx.rotate(tilt);
  ctx.drawImage(s,-w/2,-h,w,h);
  ctx.restore();
  return true;
}

/* ---- 八方旅人风功能卡：深靛渐变底 + 双层描金框 + 四角金饰 + 选中流光辉光 ---- */
function drawFuncCard(x,y,sel,t,icon,label,cw){
  const w=cw||64,h=84;
  /* 落地阴影 */
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(x+2,y+h-1,w-4,3);
  /* 卡底：垂直渐变 */
  const g=ctx.createLinearGradient(0,y,0,y+h);
  g.addColorStop(0,sel?'#3d2f68':'#292050');g.addColorStop(1,sel?'#241b48':'#120d2c');
  ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
  /* 选中：图标背后金色辉光 */
  if(sel){
    const gg=ctx.createRadialGradient(x+w/2,y+32,4,x+w/2,y+32,32);
    gg.addColorStop(0,'rgba(255,214,110,'+(0.22+0.08*Math.sin(t*3)).toFixed(3)+')');
    gg.addColorStop(1,'rgba(255,214,110,0)');
    ctx.fillStyle=gg;ctx.fillRect(x+2,y+2,w-4,h-4);
  }
  /* 双层描金边框 */
  ctx.strokeStyle='#0a0818';ctx.lineWidth=1;ctx.strokeRect(x+0.5,y+0.5,w-1,h-1);
  ctx.strokeStyle=sel?'#ffd76a':'#7a5f2a';ctx.strokeRect(x+1.5,y+1.5,w-3,h-3);
  ctx.strokeStyle=sel?'rgba(255,215,106,.45)':'rgba(122,95,42,.35)';ctx.strokeRect(x+3.5,y+3.5,w-7,h-7);
  /* 四角金饰 */
  const cs=[[x+5,y+5],[x+w-5,y+5],[x+5,y+h-5],[x+w-5,y+h-5]];
  for(const c of cs){ctx.fillStyle=sel?'#ffe9a0':'#9a7a3a';ctx.fillRect(c[0]-2,c[1]-0.5,4,1);ctx.fillRect(c[0]-0.5,c[1]-2,1,4);}
  /* 选中：沿边框奔跑的流光 */
  if(sel){
    const per=2*(w+h),p=(t*46)%per;let lx,ly;
    if(p<w){lx=x+p;ly=y;}else if(p<w+h){lx=x+w;ly=y+(p-w);}else if(p<2*w+h){lx=x+w-(p-w-h);ly=y+h;}else{lx=x;ly=y+h-(p-2*w-h);}
    ctx.fillStyle='rgba(255,242,200,.4)';ctx.fillRect(lx-4,ly-1,8,2);
    ctx.fillStyle='#fff2c8';ctx.fillRect(lx-2,ly-1,4,2);
  }
  drawIconArt(icon,x+w/2,y+32,sel?1.32+0.04*Math.sin(t*3):1.26);
  txt(label,x+w/2,y+h-9,sel?'#ffe9b0':'#c8c0e0',11,'center',true);
}

function ensureDungeonOffers(){

/* 副本通关：按 dropRar 给稀有装备 + 魔石 + 稀有材料/药品，并刷新副本入口 */
function finishCrawl(){
  const D=DUNGEONS[bt.dungeonId];
  const gd=120+bt.dungeonRounds*4+state.map.chapter*40;state.gold+=gd;bt.goldGain+=gd;
  const it=rollEquip(D.dropRar||2);state.ebag.push(it);

  save();endBattle();
}
function rollRarity(){const r=Math.random()*100;let acc=0;for(let i=0;i<RARITY.length;i++){acc+=RARITY[i].w;if(r<acc)return i;}return 0;}
function spawnGroup(){
  const MB=1.05;/* 小怪整体难度微调：血量/攻击 +5%（用户反馈略简单） */
  /* 副本：达到设定轮数就通关（finishCrawl）；绝不刷章节 BOSS */
  if(bt.crawl&&bt.wave>=bt.dungeonRounds){finishCrawl();return;}
  /* 远征结构：第 5 场必出精英，第 10 场 BOSS 战（其余场次维持随机小概率精英） */
  if(!bt.crawl&&bt.wave>=10){spawnBoss();return;}
  const cnt=ri(1,3);
  const elite=bt.crawl?true:bt.wave===5?true:Math.random()<(bt.dungeon?0.55:0.12);
  bt.elite=elite;
  /* 副本：用该副本的怪物池（稀有怪更多）；远征/遗迹：原逻辑 */
  const pool=bt.crawl?(DUNGEONS[bt.dungeonId].pool):(bt.dungeon?['bat','skel','magma','sala','wolf','frost','golem','ghost']:(ZONE_MOBS[state.map.chapter]||ZONE_MOBS[0]));/* 章节越界兜底，防坏档崩溃 */
  for(let i=0;i<cnt;i++){
    let type;const r=Math.random();
    if(r<0.26)type='cat';else type=pool[ri(0,pool.length-1)];
    const base=ENEMY[type];
    state.dex.seen[type]=(state.dex.seen[type]||0)+1;
    /* 怪物等级：随章节/波次增长（精英 +2），属性倍率由等级推导 */
    let lvl=(state.map.chapter-1)*2+bt.wave+ri(0,1);
    if(elite&&i===0)lvl+=2;
    const dc=diffC();
    const mult=1+(lvl-1)*0.14;
    const e={type,x:bt.px+120+i*36,lvl,hp:Math.round(base.hp*mult*dc.hp*MB),maxHp:Math.round(base.hp*mult*dc.hp*MB),
      atk:Math.round((base.atk+mult*0.6)*dc.atk*MB),atkT:rf(0.6,1.4),hurtT:0,capCd:0,skipped:false,
      rarity:rollRarity(),ivs:[ri(6,15),ri(6,15),ri(6,15)],bob:rf(0,6.28),elite:false,mercy:false,
      shield:elite?2:1,shieldMax:elite?2:1,brokenT:0,boss:false};
    if(elite&&i===0){e.elite=true;e.hp=Math.round(e.hp*2.2);e.maxHp=e.hp;e.atk=Math.round(e.atk*1.5);}
    bt.enemies.push(e);
  }
}
/* BOSS：单只巨型怪，约 7.5 倍血 1.85 倍攻 5 层破防盾，不可捕捉；蓄力大招+狂暴+每回合回血（不破盾打不动） */
function spawnBoss(){
  const bi=Math.min(state.map.chapter,BOSSES.length-1);const B=BOSSES[state.map.chapter]||BOSSES[BOSSES.length-1];
  const base=ENEMY[B.type];
  state.dex.seen[B.type]=(state.dex.seen[B.type]||0)+1;
  const lvl=(state.map.chapter-1)*2+10+2;
  const dc=diffC();
  const mult=(1+(lvl-1)*0.14)*7.5*dc.hp;
  const e={type:B.type,boss:true,n:B.n,x:bt.px+150,lvl,hp:Math.round(base.hp*mult),maxHp:Math.round(base.hp*mult),
    atk:Math.round((base.atk+mult*0.6)*1.85*dc.bossAtk),atkT:rf(0.55,1.1),hurtT:0,capCd:0,skipped:false,
    rarity:Math.min(3,rollRarity()+1),ivs:[ri(10,15),ri(10,15),ri(10,15)],bob:0,elite:true,mercy:false,
    shield:5,shieldMax:5,brokenT:0,bossCD:3,bossBig:false,enraged:false};
  /* 每战随机 2 个魔法抗性（不与弱点重叠）：抗性属性命中伤害 ×0.45。
     挂机编队无脑轮放必然砸在抗性上——手动看抗性换属性才有优势 */
  const weak=WEAK_OF[B.type]||[];const pool=[];for(let i=0;i<ELEMS.length;i++)if(weak.indexOf(i)<0)pool.push(i);
  e.resist=[];while(e.resist.length<2&&pool.length>0){const pi=Math.floor(Math.random()*pool.length);e.resist.push(pool.splice(pi,1)[0]);}
  e.resistKnown=false;
  bt.elite=true;bt.bossFight=true;
  bt.enemies.push(e);
  toast('⚠ '+B.n+' 出现！用它的弱点属性魔法破盾，蓄力大招记得打断/防御！','#ff9');
}
function nearestEnemy(range){let best=null,bd=1e9;for(const e of bt.enemies){const d=e.x-bt.px;if(d>-6&&d<range&&Math.abs(d)<bd){bd=Math.abs(d);best=e;}}return best;}
function enemyFeetY(){return 250;}
function engageStop(e){return bt.px+78+bt.enemies.indexOf(e)*16;/* 远程交战：怪停在 78/94/110，法师站桩输出不贴脸 */}
function engage(dt){/* 敌人主动走近玩家，到近战距离停下 */
  for(const e of bt.enemies){
    const stop=engageStop(e);
    if(e.x>stop)e.x=Math.max(stop,e.x-(46+bt.wave*2+(e.elite?10:0))*dt);
  }
}
function dealTo(e,dmg,color){
  if(e.brokenT>0)dmg=Math.round(dmg*1.4);/* 破防易伤：所有来源伤害 ×1.4 */
  e.hp-=dmg;e.hurtT=0.15;
  /* 狂暴：BOSS 血量过半触发二阶段，攻击大幅提升、大招更频繁 */
  if(e.boss&&!e.enraged&&e.hp>0&&e.hp<=e.maxHp*0.65){e.enraged=true;e.atk=Math.round(e.atk*1.6);e.bossCD=Math.min(e.bossCD,2);toast('🔥 '+e.n+' 狂暴了！攻击大幅提升，大招更频繁！','#ff6b6b');bt.shake=0.4;}
  bt.nums.push({x:e.x,y:enemyFeetY()-34,v:''+dmg,c:color||'#fff',t:0.8});
  /* 手下留情只在「持有对应捕捉道具」时锁血——没道具的怪会被正常打死，绝不卡死 */
  if(ENEMY[e.type].capturable&&canCapture(e)){const fl=Math.max(1,Math.round(e.maxHp*0.08));if(e.hp<=fl){e.hp=fl;if(!e.mercy){e.mercy=true;e.mercyT=0;toast('手下留情！'+ENEMY[e.type].n+' 留了残血，可以捕捉','#7cf');}}}
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
  const idx=bt.enemies.indexOf(e);if(idx<0)return;bt.enemies.splice(idx,1);
  const base=ENEMY[e.type];const m=e.boss?9:(e.elite?3:1);
  if(e.boss){/* BOSS 战利品：必掉高品质装备，直接发（结算面板只展示金币/经验汇总） */

/* 伙伴经验：出战伙伴在击杀时获得，达到阈值升级并小幅提升资质 */

function partnerStrike(){

function itemOpts(){const o=[];if(state.potions>0)o.push({k:'potion',n:'体力药水 x'+state.potions});if(state.orbs>0)o.push({k:'orb',n:'捕捉球 x'+state.orbs});if(state.seals>0)o.push({k:'seal',n:'魔法封印卡 x'+state.seals});return o.length?o:[{k:'none',n:'（空）'}];}
/* 是否「现在就能抓」：可捕 + 血量达标 + 持有对应道具 */
function canCapture(e){
  if(e.boss)return false;/* BOSS 不可捕捉 */
  const bd=ENEMY[e.type];if(!bd.capturable)return false;
  const cap=bd.cap||{};const ratio=e.hp/e.maxHp;
  if(cap.hp!=null&&ratio>cap.hp)return false;            /* 需压到指定血量以下 */
  if(cap.tool==='seal'&&state.seals<=0)return false;      /* 缺封印卡 */
  if(cap.tool!=='seal'&&state.orbs<=0)return false;       /* 缺捕捉球 */
  return true;
}
function captureTarget(){
  /* 选靶优先级：①图鉴未收录的怪（自动收集多样性，杜绝"只囤狐狸"）②非猫灵 ③血量越低越优先 */
  let best=null,bestScore=1e9;
  for(const e of bt.enemies){
    if(!canCapture(e)||e.hp<=0)continue;
    const uncaught=!state.dex.caught[e.type];
    const score=(uncaught?0:100)+(e.type==='cat'?12:0)+(e.hp/e.maxHp);
    if(score<bestScore){bestScore=score;best=e;}
  }
  return best;
}
/* 捕捉概率一览（含出战伙伴特性加成）：
   捕捉球 = 稀有度上限 x 虚弱系数，N 球满血 37% → 虚弱 95%；UR 满血仅 11%，克制高稀有
   封印卡 = 固定 75%~95%（血越少越高），无视稀有度压制，专治 SSR/UR
   特性「幸运/柔软」额外 +10%/+15% */
function captureChance(e,kind){
  const ratio=e.hp/e.maxHp;
  let p=kind==='seal'?clamp(0.75+(1-ratio)*0.2,0.75,0.95):clamp((RARITY[e.rarity]||RARITY[0]).cap*(1.45-ratio)/1.15,0.05,0.95);
  const pr=state.partners[state.activePartner];
  if(pr){if(pr.trait==='lucky')p+=0.10;if(pr.trait==='flex')p+=0.15;}
  return clamp(p,0.02,0.98);
}
function throwOrb(kind){
  const e=captureTarget();
  if(!e){SFX.fail();toast('没有可捕捉的魔物','#ff9');return;}
  if(kind==='auto')kind=(ENEMY[e.type].cap&&ENEMY[e.type].cap.tool==='seal')?'seal':'orb';
  const needSeal=(kind==='seal');
  if(needSeal){if(state.seals<=0){SFX.fail();toast('没有魔法封印卡！','#ff6b6b');return;}state.seals--;}
  else{if(state.orbs<=0){SFX.fail();toast('没有捕捉球！','#ff6b6b');return;}state.orbs--;}
  const r=RARITY[e.rarity];
  const p=captureChance(e,kind);
  bt.fx.push({k:'orb',x:bt.px+10,y:230,tx:e.x,t:0.4,c:needSeal?PAL.purple:PAL.blue});
  if(Math.random()<p){
    const idx=bt.enemies.indexOf(e);if(idx>=0)bt.enemies.splice(idx,1);
    const bd=ENEMY[e.type];
    state.partners.push({type:e.type,name:pick(bd.names||CAT_NAMES),rarity:e.rarity,ivs:e.ivs,level:Math.max(1,state.level),
      exp:0,seal:needSeal,skill:pick(bd.skills||['claw']),trait:pick(bd.traits||['tough']),evolved:false});
    state.cats++;SFX.capture();
    if(!state.dex.caught[e.type])state.dex.caught[e.type]=0;state.dex.caught[e.type]++;
    toast((needSeal?'封印成功！':r.k+' 收服成功！')+'（'+Math.round(p*100)+'%）','#7cf');save();
    if(bt.enemies.length===0)winBattle();
  }else{
    e.capCd=2.6;e.hp=Math.min(e.maxHp,e.hp+Math.round(e.maxHp*0.08));
    bt.fx.push({k:'ring',x:e.x,y:enemyFeetY()-12,r:4,c:'#ff9',t:0.4});SFX.fail();
    toast((needSeal?'封印被挣脱！（卡-1）':'它挣脱了！（球-1）')+' 概率'+Math.round(p*100)+'%','#ff9');
  }
}
function afterPlayerAction(){

function enemyAttack(){

  const e=bt.enemies[bt.enemyIdx];
  if(e&&e.hp>0&&!e.skipped&&!(e.brokenT>0)){/* 破防硬直中的怪跳过回合（brokenT 缺失时按未破防处理，避免卡死） */
    /* BOSS 蓄力大招：每 4 个行动回合触发一次，更长的前摇 + 中点结算巨额伤害（破防/防御可化解） */
    /* BOSS 回血：每次行动回 3% 最大生命（破防硬直中不回）——不打破盾就打白费，逼玩家走弱点破防循环 */
    if(e.boss&&e.hp<e.maxHp){const hg=Math.max(1,Math.round(e.maxHp*(e.enraged?0.045:0.03)));e.hp=Math.min(e.maxHp,e.hp+hg);bt.nums.push({x:e.x,y:enemyFeetY()-58,v:'+'+hg,c:PAL.green,t:0.8});}
    if(e.boss&&e.bossCD>0)e.bossCD--;
    if(e.boss&&e.bossCD<=0){e.bossBig=true;e.bossCD=e.enraged?2:3;e.lunge={t:0,dur:0.95,hit:false,big:true};bt.enemyIdx++;bt.actT=e.lunge.dur+0.15;toast('⚡ '+e.n+' 蓄力中——快破盾或防御！','#ff6b6b');return;}
    /* 冲锋攻击：怪冲上去→中点结算伤害→退回原位（回合制的近身演出，法师保持远程） */
    e.lunge={t:0,dur:e.type==='slime'?0.66:0.55,hit:false};
    bt.enemyIdx++;/* 起冲锋即推进指针，伤害由动画中点结算（否则同一只怪无限冲锋） */
    bt.actT=e.lunge.dur+0.15;
    return;
  }
  bt.enemyIdx++;bt.actT=0.4;

function applyEnemyHit(e){
  const pr=state.partners[state.activePartner];
  let d=Math.max(1,e.atk+ri(-1,2));
  if(e.bossBig){d=Math.round(d*2.6);e.bossBig=false;bt.shake=0.5;toast('💥 '+e.n+' 大招命中！','#ff6b6b');}/* 蓄力大招：伤害 ×2.6 + 强震屏 */
  d=Math.max(1,Math.round(d*diffC().dmgTaken));/* 难度：玩家受伤倍率 */
  d=Math.max(1,d-eqDef());/* 护甲减伤 */
  if(pr&&pr.trait==='tough')d=Math.round(d*0.9);/* 特性·坚壁：主人受伤 -10% */
  if(bt.guardBlock>0){const cut=Math.round(d*bt.guardBlock);d=Math.max(1,d-cut);bt.guardBlock=Math.max(0,bt.guardBlock-0.15);}/* 技能·守护：护盾抵消部分伤害 */
  state.hp-=d;bt.hurtT=0.25;SFX.hit();
  bt.nums.push({x:bt.px,y:200,v:'-'+d,c:PAL.red,t:0.8});
  if(state.hp<=0){state.hp=0;bt.phase='faint';bt.actT=1.6;SFX.fail();}
}
function autoAct(){
  if(bt.enemies.length===0){winBattle();return;}/* 空场保护：绝不对着空气行动 */
  const cap=captureTarget();
  if(cap&&state.autoCapture){
    /* 优先级1：虚弱可捕怪自动捕捉（throwOrb('auto') 按需求自动选球/卡） */
    throwOrb('auto');
    if(bt&&bt.phase==='menu')afterPlayerAction();
    return;
  }
  if(!state.autoCapture){
    /* 关自动捕：虚弱被锁血的怪主动逃走清场，避免挂机空转（无道具时根本不会锁血，怪正常被打死） */
    const fl=e=>Math.max(1,Math.round(e.maxHp*0.08));
    for(const e2 of [...bt.enemies]){
      if(ENEMY[e2.type].capturable&&e2.hp<=fl(e2)&&e2.mercy){bt.enemies.splice(bt.enemies.indexOf(e2),1);toast('虚弱的魔物逃走了…','#9ab');}
    }
    if(bt.enemies.length===0){winBattle();return;}
  }
  if(state.hp/state.maxHp<0.35&&state.potions>0){bt.itemIdx=0;useItem();}
  else{
    /* 自动循环编队里的魔法：每回合轮到下一个，优先放得起的最强魔法 */
    const lo=activeLoadout();let chosen=null;
    for(let i=1;i<=lo.length;i++){const k=lo[(bt.autoSpell+i)%lo.length];if(state.mp>=spellCost(k)){chosen=k;bt.autoSpell=(bt.autoSpell+i)%lo.length;break;}}
    if(chosen){if(bt.lastSpell!==chosen)toast('施法·'+spellName(chosen),spellElem(chosen));bt.lastSpell=chosen;state.equipped=chosen;magicCast();}
    else heroStrike();
  }
}
function winBattle(){/* 只要还有敌人且不在结算，就切结算（lootDone 只代表发过奖，不再拦截切阶段——否则清场后永远卡在 menu） */
  if(bt.phase==='result')return;bt.lootDone=true;save();bt.phase='result';bt.autoT2=2.0;/* 每次进结算都重置，避免自动模式下结算画面被瞬间跳过（之前每波只闪 1 帧） */
  /* 职业晋升只走魔法学院「职业晋升考核」，战斗胜利不再自动弹晋升界面——
     否则"打几仗自动就职业晋升了"，魔法学院的晋升考核形同虚设（之前就是这个 bug） */}
function nextWave(){
  if(bt.done){endBattle();SFX.confirm();return;}/* 远征已完成：结算后回城 */
  if(bt.crawl&&bt.wave>=bt.dungeonRounds){finishCrawl();return;}/* 副本：达到轮数即通关（finishCrawl 内已发奖+刷新入口） */
  if(!bt.crawl&&bt.dungeon&&bt.wave>=3){/* 遗迹秘境通关：豪华奖励 */
    const gd=100+50*state.map.chapter;
    state.gold+=gd;state.crystals++;state.orbs++;state.seals++;
    endBattle();SFX.level();toast('遗迹探索成功！+'+gd+'金 +魔晶 +捕捉球 +封印卡','#ffd93d');
    return;
  }
  if(!bt.crawl&&bt.wave>=10){finishExpedition();return;}/* 第 10 场 BOSS 战胜利 → 远征结束 */
  bt.wave++;
  /* 非战斗探索事件：两轮战斗之间调剂（宝箱/陷阱/医疗站/稀有药草）。
     概率提到 45%，且每轮保底至少触发 1 次（第 4 波前还没遇到就强制来一次），杜绝"整轮都没事件"的空洞感 */
  const forceEvent=!bt.eventSeen&&bt.wave>=4;
  if(bt.wave<10&&(Math.random()<0.45||forceEvent)){bt.eventSeen=true;bt.event=rollEvent();bt.phase='event';bt.eventT=0;return;}
  bt.phase='walk';bt.walkT=0;bt.walkNext=rf(2.8,4.2);bt.lootDone=false;bt.elite=false;bt.bossFight=false;
}
/* 远征完成收尾：奖励已在 BOSS 死亡时发放（killEnemy），这里只负责回城 */
function finishExpedition(){
  bt.done=true;bt.phase='result';bt.lootDone=true;bt.autoT2=2.0;/* 最终结算也重置，确保整体计算画面停留可见 */
  toast('远征完成！'+CHAPTERS[Math.min(state.map.chapter,CHAPTERS.length-1)]+' 肃清，回城休整','#ffd93d');
  save();
}
/* ---- 探索事件（战斗之间的调剂） ---- */
function rollEvent(){const r=Math.random();
  if(r<0.32)return{k:'chest'};if(r<0.55)return{k:'trap'};if(r<0.78)return{k:'spring'};return{k:'herb'};}
const EVENT_INFO={chest:{n:'闪闪发光的宝箱',d:'A 打开宝箱'},trap:{n:'草丛下的陷阱！',d:'A 小心通过'},spring:{n:'清澈的泉水',d:'A 饮水休息'},herb:{n:'一丛稀有药草',d:'A 采集'}};
function applyEvent(){
  if(!bt||!bt.event)return;/* 空引用守卫：auto 结算后再按 A 不会炸 */
  const k=bt.event.k;const ch=state.map.chapter;
  if(k==='chest'){
    const gd=ri(30,60)+40*ch;state.gold+=gd;bt.goldGain+=gd;
    const lines=['金币 +'+gd];
    /* 掉 1~3 件药品/材料（章节越高稀有度越好），宝箱里还会出魔石 */
    const n=ri(1,3);
    for(let i2=0;i2<n;i2++){
      if(Math.random()<0.45){const id=ri(0,POTIONS.length-1);let ir=POTIONS[id].ir!=null?POTIONS[id].ir:rollIRar(ch*2);ir=Math.min(3,ir+(Math.random()<ch*0.08?1:0));state.pbag[id]=(state.pbag[id]||0)+1;lines.push({c:IRARITY[ir].c,s:IRARITY[ir].k+'·'+POTIONS[id].n});}
      else{const id=ri(0,MATERIALS.length-1);const ir=MATERIALS[id].ir!=null?MATERIALS[id].ir:rollIRar(ch*2);state.mbag[id]=(state.mbag[id]||0)+1;lines.push({c:IRARITY[ir].c,s:IRARITY[ir].k+'·'+MATERIALS[id].n});}
    }
    if(Math.random()<0.30){const st=Math.min(3,1+Math.floor(ch/2));const tn=ri(1,2);state.stones[st]=stoneN(st)+tn;lines.push({c:STONE_C[st],s:STONE_NAMES[st]+' ×'+tn});}
    if(Math.random()<0.20){state.orbs+=2;lines.push({c:'#7cf',s:'捕捉球 ×2'});}
    if(Math.random()<0.12){state.crystals+=1;lines.push({c:'#c06bff',s:'魔晶 ×1'});}
    bt.lootShow={title:'✦ 宝箱战利品 ✦',lines:lines,t:3.0,t0:3.0};SFX.coin();
    toast('宝箱开启！+'+gd+'金，共 '+(lines.length-1)+' 件战利品','#ffd93d');
  }else if(k==='trap'){
    /* 陷阱必有代价：必掉血（10~18% 上限 HP），半数情况还会被顺手偷走一点金币 */
    const d=Math.round(state.maxHp*rf(0.10,0.18));state.hp=Math.max(1,state.hp-d);
    bt.nums.push({x:bt.px,y:200,v:'-'+d,c:PAL.red,t:0.9});
    let extra='';
    if(Math.random()<0.5){const lost=Math.min(state.gold,ri(15,35));state.gold-=lost;extra=' 还被偷走 '+lost+' 金';}
    toast('踩中陷阱！-'+d+' HP'+extra,'#ff6b6b');SFX.hit();
  }else if(k==='spring'){
    state.hp=Math.min(state.maxHp,state.hp+Math.round(state.maxHp*0.5));state.mp=Math.min(state.maxMp,state.mp+Math.round(state.maxMp*0.5));
    toast('泉水恢复了一半 HP/MP','#7cf');SFX.potion();
  }else{
    const h=ri(3,6);state.herbs+=h;const lines2=[{c:'#7fdc8a',s:'月光草 ×'+h}];let extra='';
    if(Math.random()<0.35){state.crystals++;lines2.push({c:'#c06bff',s:'魔晶 ×1'});extra='，还发现了魔晶！';}
    const mid=ri(0,MATERIALS.length-1);const mir=MATERIALS[mid].ir!=null?MATERIALS[mid].ir:rollIRar(ch*2);state.mbag[mid]=(state.mbag[mid]||0)+1;lines2.push({c:IRARITY[mir].c,s:IRARITY[mir].k+'·'+MATERIALS[mid].n});
    bt.lootShow={title:'✦ 采集收获 ✦',lines:lines2,t:2.6,t0:2.6};
    toast('采集到月光草 x'+h+extra,'#7fdc8a');SFX.coin();
  }
  save();bt.event=null;bt.phase='walk';bt.walkT=0;bt.walkNext=rf(2.8,4.2);bt.lootDone=false;bt.elite=false;bt.bossFight=false;
}
function endBattle(){bt=null;state.scene='CITY';cityMode='map';save();}

SCENES.BATTLE={
  update(dt){
    if(bt==null)return;
    /* NaN 防护：历史版本 bug 可能污染数值，进战斗前先洗一遍 */
    if(!isFinite(state.hp))state.hp=Math.ceil(state.maxHp*0.5);
    if(!isFinite(state.mp))state.mp=0;
    if(!isFinite(state.gold))state.gold=0;
    for(const e of bt.enemies){if(!isFinite(e.hp)||e.hp>1e8)e.hp=e.maxHp;if(!isFinite(e.maxHp)||e.maxHp<=0)e.maxHp=1;}
    bt.t+=dt;
    /* 中毒持续掉血（技能·毒牙触发 e.poison） */
    if(bt){for(const e of [...bt.enemies]){if(e.poison>0){e.poison-=dt;e.poisonTick=(e.poisonTick||0)-dt;if(e.poisonTick<=0){e.poisonTick=0.5;if(e.hp>0)dealTo(e,Math.max(1,Math.round(e.maxHp*0.02)),'#7fdc8a');}}}}
    /* 锁血兜底：手下留情锁定超 8 秒仍未收服 → 恢复力气逃走（杜绝任何模式下的永久卡死） */
    if(bt){for(const e of [...bt.enemies]){if(e.mercy){e.mercyT=(e.mercyT||0)+dt;if(e.mercyT>8){bt.enemies.splice(bt.enemies.indexOf(e),1);toast(ENEMY[e.type].n+' 恢复力气逃走了…','#9ab');if(bt.enemies.length===0&&bt.phase!=='result')winBattle();}}}}
    /* 破防恢复：硬直结束后护盾回满 */
    if(bt){for(const e of bt.enemies){if(e.brokenT>0){e.brokenT-=dt;if(e.brokenT<=0){e.brokenT=0;e.shield=e.shieldMax;}}}}
    /* 伙伴突击动画推进：中点结算伤害（任何阶段都推进，防止动画冻结） */
    if(bt&&bt.catLunge){const L=bt.catLunge;L.t+=dt;if(!L.hit&&L.t>=L.dur*0.5){L.hit=true;applyCatHit();}if(bt.catLunge&&L.t>=L.dur+0.1)bt.catLunge=null;}
    /* 看门狗：同一阶段卡 12 秒则强制推进，杜绝任何形式的永久卡死。
       注意：HP/MP 挂机时会缓慢回复，不能进信号（否则信号一直变、看门狗永远不触发） */
    bt.stallT=(bt.stallT||0)+dt;
    const sig=bt.phase+'|'+bt.enemyIdx+'|'+bt.turn+'|'+bt.enemies.length+'|'+Math.round(state.hp/25);
    if(sig!==bt.lastSig){bt.lastSig=sig;bt.stallT=0;}
    else if(bt.stallT>5){
      bt.stallT=0;
      if(bt.phase==='menu'){bt.autoT=0;autoAct();toast('战斗停滞已自动恢复','#ffd93d');}
      else if(bt.phase==='enemy'){bt.enemyIdx=bt.enemies.length;bt.actT=0;}
      else if(bt.phase==='result'&&bt.auto){nextWave();}
      else if(bt.phase==='meet'){bt.actT=0;}
      else if(bt.phase==='faint'){bt.actT=0;}
      else if(bt.phase==='walk'){bt.walkT=bt.walkNext;}
    }
    if(bt.phase==='walk'){
      bt.px+=40*dt;bt.cam=bt.px-70;bt.walkF+=dt*8;
      state.mp=Math.min(state.maxMp,state.mp+3*dt);state.hp=Math.min(state.maxHp,state.hp+2.5*dt);
      bt.walkT+=dt;
      if(bt.walkT>=bt.walkNext){bt.phase='meet';bt.actT=0.6;}
    }else if(bt.phase==='meet'){
      bt.actT-=dt;if(bt.actT<=0){spawnGroup();bt.turn=1;bt.phase='menu';}
    }else if(bt.phase==='menu'){
      engage(dt);
      if(bt.auto){bt.autoT-=dt;if(bt.autoT<=0)autoAct();}
    }else if(bt.phase==='enemy'){
      engage(dt);
      /* 冲锋动画推进：中点结算伤害 */
      for(const e of bt.enemies){const L=e.lunge;if(L){L.t+=dt;if(!L.hit&&L.t>=L.dur*0.5){L.hit=true;applyEnemyHit(e);if(bt.phase==='faint')return;}if(L.t>=L.dur+0.1)e.lunge=null;}}
      bt.actT-=dt;if(bt.actT<=0)enemyAttack();
    }else if(bt.phase==='magic'||bt.phase==='item'){
      engage(dt);
    }else if(bt.phase==='result'){
      if(bt.auto){bt.autoT2-=dt;if(bt.autoT2<=0)nextWave();}
    }else if(bt.phase==='event'){
      /* 探索事件阶段：自动模式下停留约 1 秒后自动触发（A），避免 AUTO 挂机卡在事件面板 */
      bt.eventT+=dt;if(bt.auto&&bt.eventT>1.0)applyEvent();
    }else if(bt.phase==='faint'){
      bt.actT-=dt;if(bt.actT<=0){state.hp=Math.ceil(state.maxHp*0.5);state.mp=Math.ceil(state.maxMp*0.5);if(bt.crawl)state.dungeonOffers=null;endBattle();toast('力竭回城休息（无惩罚）','#ff9');}
    }
    if(bt){
      bt.fx=bt.fx.filter(f=>{f.t-=dt;if(f.k==='p'){f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=(f.g!=null?f.g:200)*dt;}if(f.k==='ring')f.r+=90*dt;if(f.k==='orb'){f.x+=(f.tx-f.x)*6*dt;f.y-=30*dt;}return f.t>0;});
      bt.nums=bt.nums.filter(n=>{n.t-=dt;n.y-=22*dt;return n.t>0;});
      bt.hurtT=Math.max(0,bt.hurtT-dt);
      bt.lungeT=Math.max(0,(bt.lungeT||0)-dt);
      bt.shake=Math.max(0,(bt.shake||0)-dt*1.4);
      if(bt.lootShow){bt.lootShow.t-=dt;if(bt.lootShow.t<=0)bt.lootShow=null;}
    }
    toasts.forEach(t=>t.t-=dt);
  },
  onBtn(b){
    if(!bt)return;
    if(bt.phase==='event'){if(b==='A')applyEvent();else if(b==='C'){toast('绕开了事件','#9ab');bt.event=null;bt.phase='walk';bt.walkT=0;bt.walkNext=rf(2.8,4.2);bt.lootDone=false;bt.elite=false;bt.bossFight=false;}return;}
    if(bt.phase==='walk'){
      if(b==='A'){bt.auto=!bt.auto;bt.autoT=1.4;toast(bt.auto?'已开启 AUTO 挂机':'已切换手动','#7cf');}
      else if(b==='B'){endBattle();SFX.cancel();}
    }else if(bt.phase==='menu'){
      if(bt.auto&&b!=='C'){bt.auto=false;toast('手动接管','#ffd93d');}
      if(b==='A')heroStrike();
      else if(b==='B'){const lo=activeLoadout();bt.magicIdx=0;state.equipped=lo[0];bt.phase='magic';SFX.confirm();}
      else if(b==='C'){bt.phase='item';const opts=itemOpts();const cap=captureTarget();let sel=0;if(cap){const bd=ENEMY[cap.type];const k=bd.cap&&bd.cap.tool==='seal'?'seal':'orb';const i=opts.findIndex(o=>o.k===k);if(i>=0)sel=i;}bt.itemIdx=sel;SFX.confirm();}
    }else if(bt.phase==='magic'){
      if(b==='A'){bt.phase='menu';magicCast();}
      else if(b==='B'){const lo=activeLoadout();bt.magicIdx=(bt.magicIdx+1)%lo.length;state.equipped=lo[bt.magicIdx];SFX.move();}
      else if(b==='C'){bt.phase='menu';SFX.cancel();}
    }else if(bt.phase==='item'){
      if(b==='A'){bt.phase='menu';useItem();}
      else if(b==='B'){const opts=itemOpts();bt.itemIdx=(bt.itemIdx+1)%opts.length;SFX.move();}
      else if(b==='C'){bt.phase='menu';SFX.cancel();}
    }else if(bt.phase==='result'){
      if(b==='A'){nextWave();SFX.confirm();}
      else if(b==='B'){endBattle();SFX.cancel();}
    }
  },
  draw(){drawBattle();}
};

/* ---- battle draw ---- */
function drawBattle(){
  if(!bt)return;/* 防御：战斗对象不存在（如结算后同一帧被绘制）绝不能裸读 bt.cam */
  /* 命中震屏：大魔法让整个画面横向抖动 */
  const cam=bt.cam+(bt.shake>0?Math.sin(bt.t*80)*3.4*bt.shake:0);
  px(0,0,W,H,'#15102a');/* 整屏先清空，防止上一场景残影 */
  const wrap=(v,span,f)=>(((v-cam*f)%span)+span)%span;
  const bg=Assets.battleBg;
  if(bg){/* HD-2D 手绘背景：整高铺满 + 横向视差窗口缓移 */
    const sw=Math.round(bg.height*(W/H));
    const range=bg.width-sw;
    const sx=range>0?((cam*0.14+bt.t*3)%range+range)%range:0;
    ctx.drawImage(bg,sx,0,sw,bg.height,0,0,W,H);
    ctx.fillStyle='rgba(10,8,22,.38)';ctx.fillRect(0,0,W,30);
    ctx.fillStyle='rgba(10,8,22,.18)';ctx.fillRect(0,30,W,14);
  }else{
  /* 兜底：代码绘制黄昏场景 */
  for(let y=0;y<156;y+=2){ctx.fillStyle=lerpHex('#463273','#191233',Math.min(1,y/140));ctx.fillRect(0,y,W,2);}
  for(const s of bStars){const a=0.3+0.6*Math.abs(Math.sin(s.s+bt.t*1.3));ctx.globalAlpha=a;ctx.fillStyle='#fff';ctx.fillRect(s.x|0,s.y|0,s.r,s.r);}
  ctx.globalAlpha=1;
  ctx.fillStyle='#ffe9a8';ctx.beginPath();ctx.arc(204,30,11,0,6.28);ctx.arc(199,26,10,0,6.28,true);ctx.fill('evenodd');
  ctx.fillStyle='#332759';
  for(let i=0;i<7;i++)tri(wrap(i*46,W+46,0.12)-23,158,60,46);
  ctx.fillStyle='#271e48';
  for(let i=0;i<6;i++)tri(wrap(i*64,W+64,0.25)-32,158,78,60);
  for(let i=0;i<11;i++){const tx=wrap(i*33,W+33,0.5)-16;pine(tx,252,30+((i*37)%15));}
  for(let y=250;y<H;y+=2){ctx.fillStyle=lerpHex('#41632f','#1f341c',Math.min(1,(y-250)/70));ctx.fillRect(0,y,W,2);}
  px(0,250,W,3,'#5c8f42');px(0,253,W,2,'#4a7a3a');
  }
  /* 飘浮光尘 */
  for(const p of bDust){const dy=(p.y-bt.t*p.sp)%180;const yy=dy<0?dy+180:dy;const a=0.25+0.4*Math.abs(Math.sin(p.tw+bt.t*2));ctx.globalAlpha=a;px(((p.x+Math.sin(bt.t+p.tw)*6)|0),yy+60,1.5,1.5,'#ffd98a');}
  ctx.globalAlpha=1;
  /* 人物活动带整体压暗：无论背景多花，角色永远是最亮的 */
  const gDim=ctx.createLinearGradient(0,140,0,270);
  gDim.addColorStop(0,'rgba(6,5,16,0)');gDim.addColorStop(0.45,'rgba(6,5,16,.38)');gDim.addColorStop(1,'rgba(6,5,16,.22)');
  ctx.fillStyle=gDim;ctx.fillRect(0,140,W,130);
  for(const e of bt.enemies){const sx0=e.x-cam;if(sx0<-60||sx0>W+60)continue;
    const bd=ENEMY[e.type];const sy=enemyFeetY();
    const fly=!!bd.fly;
    /* 冲锋攻击位移：sin 曲线冲向英雄再退回原位 */
    let sx=e.x-cam;let lungeTilt=0;
    if(e.lunge){const lp=clamp(e.lunge.t/e.lunge.dur,0,1);const dash=Math.max(0,e.x-bt.px-16);sx-=Math.sin(lp*Math.PI)*dash;lungeTilt=-0.12*Math.sin(lp*Math.PI);}
    /* 地面怪：弹跳+落地压扁；悬浮怪：正弦飘浮 */
    const hopPh=Math.abs(Math.sin(bt.t*(e.type==='slime'?4.2:5.2)+e.bob));
    const hopY=fly?Math.sin(bt.t*2.6+e.bob)*4:-(e.type==='slime'?5:3.5)*hopPh;
    const sq=fly?1:1+(e.type==='slime'?0.14:0.06)*(1-hopPh);/* 越接近落地越扁 */
    const eTilt=e.hurtT>0?-0.14:lungeTilt;/* 受击后仰 / 冲锋前倾 */
    const hPix=bd.h*(e.elite?1.25:1)*(e.boss?2.1:1);
    shadow(sx,sy,(fly?5:bd.h/4)*(e.elite?1.3:1)*(e.boss?2:1));
    const spr={goblin:'spGoblin',slime:'spSlime',cat:'spCat'}[e.type];
    if(!spr||!drawSprite(spr,sx,sy+hopY,hPix,sq,eTilt)){
      if(e.boss){/* BOSS：像素立绘整体放大 2.1 倍（八方旅人式巨大 BOSS 演出） */
        ctx.save();ctx.translate(sx,sy+hopY);ctx.scale(2.1,2.1);drawMob(e.type,0,0,bt.t);ctx.restore();
      }else drawMob(e.type,sx,sy+hopY,bt.t);
    }
    if(e.elite){px(sx-2,sy-30,4,3,'#ffd93d');px(sx-1,sy-27,2,3,'#ffd93d');px(sx+1,sy-30,1,1,'#ffd93d');}
    /* 破防盾槽：小菱形排（弱点魔法命中削一格），破防后空槽闪烁恢复 */
    if(e.shieldMax>0){const sw=e.boss?9:6;const tot=e.shieldMax*(sw+2);
      for(let s2=0;s2<e.shieldMax;s2++){const dx2=sx-tot/2+s2*(sw+2);
        if(s2<e.shield){ctx.fillStyle='#7fd4ff';ctx.beginPath();ctx.moveTo(dx2+sw/2,sy-56);ctx.lineTo(dx2+sw,sy-52.5);ctx.lineTo(dx2+sw/2,sy-49);ctx.lineTo(dx2,sy-52.5);ctx.closePath();ctx.fill();}
        else if(e.brokenT>0){ctx.globalAlpha=0.5+0.5*Math.sin(bt.t*10);ctx.strokeStyle='#ff9';ctx.lineWidth=1;ctx.strokeRect(dx2,sy-56,sw,7);ctx.globalAlpha=1;}}}
    bar(sx-(e.boss?24:12),sy-(e.boss?30:26),e.boss?48:24,3,e.hp/e.maxHp,'#331a1a',e.hurtT>0?'#fff':'#e05555');
    txt('Lv'+e.lvl,sx+13,sy-(e.boss?40:35),e.elite?'#ffd93d':'#c9b8ee',7,'left',true);
    if(e.boss)txt(e.n||'BOSS',sx,sy-70,'#ff9',11,'center',true);
    if(e.brokenT>0)txt('破防硬直',sx,sy-62,'#ff9',8,'center',true);
    if(e.boss&&e.lunge&&e.lunge.big){const a=0.45+0.55*Math.abs(Math.sin(bt.t*16));ctx.globalAlpha=a;txt('⚡蓄力大招!',sx,sy-82,'#ff6b6b',11,'center',true);ctx.globalAlpha=1;}/* BOSS 蓄力警告 */
    if(e.boss&&e.enraged)txt('狂暴',sx+22,sy-40,'#ff6b6b',9,'left',true);/* BOSS 二阶段标记 */

/* ---- ALCHEMY ---- */

  {n:'捕捉球',cost:{mats:2},out:'orbs',desc:'捕捉伙伴必备'},
  {n:'魔法封印卡',cost:{mats:2,crystals:1},out:'seals',desc:'高级捕捉 75~95%'},
  {n:'中级魔石',cost:{mats:6},make:1,desc:'魔法升级货币'},
  {n:'高级魔石',cost:{crystals:3},make:2,desc:'魔法升级货币'},
  {n:'国家级魔石',cost:{crystals:6,mats:4},make:3,desc:'魔法升级货币'},
  {n:'古代魔石',cost:{crystals:10},make:4,desc:'魔法升级货币'}

function canCraft(r){for(const k in r.cost)if(state[k]<r.cost[k])return false;return true;}
SCENES.ALCHEMY={
  onBtn(b){
    if(b==='A'){const r=RECIPES[alcIdx];if(!canCraft(r)){SFX.fail();toast('材料不足','#ff6b6b');return;}for(const k in r.cost)state[k]-=r.cost[k];if(r.make)state.stones[r.make]=stoneN(r.make)+1;if(r.out)state[r.out]++;SFX.potion();toast('炼成了：'+r.n);save();}
    else if(b==='B'){alcIdx=(alcIdx+1)%RECIPES.length;SFX.move();}
    else if(b==='C'){state.scene='CITY';cityMode='map';SFX.cancel();}
  },
  update(){},
  draw(){
    px(0,0,W,H,PAL.bg);
    frameBox(10,10,W-20,H-50,'炼 金 小 屋');
    const show=5,start=Math.max(0,Math.min(RECIPES.length-show,alcIdx-Math.floor(show/2)));
    for(let i=0;i<show;i++){const idx=start+i;if(idx>=RECIPES.length)break;const r=RECIPES[idx];const sel=idx===alcIdx;const y=32+i*44;
      box(20,y,W-40,40,sel?'#33285c':'#241d40',sel?PAL.gold:PAL.frame);
      txt(r.n,30,y+14,'#fff',12,'left',true);
      let cost='';for(const k in r.cost)cost+=({herbs:'月光草',mats:'兽骨',crystals:'魔晶'}[k]+'×'+r.cost[k]+' ');if(r.make)cost+='→ '+STONE_NAMES[r.make]+'×1';
      txt('需要：'+cost,30,y+30,canCraft(r)?PAL.dim:PAL.red,8,'left');
      txt(r.desc,W-28,y+14,canCraft(r)?PAL.green:PAL.red,8,'right');
      if(sel)txt('A 炼制',W-28,y+30,PAL.gold,9,'right',true);}
    if(start>0)txt('▲',W-20,26,PAL.dim,8,'right');
    if(start+show<RECIPES.length)txt('▼',W-20,262,PAL.dim,8,'right');
    txt('持有 月光草'+state.herbs+' 兽骨'+state.mats+' 魔晶'+state.crystals,W/2,247,PAL.gold2,8,'center');
    txt('魔石 '+STONE_NAMES[1]+':'+stoneN(1)+' '+STONE_NAMES[2]+':'+stoneN(2)+' '+STONE_NAMES[3]+':'+stoneN(3)+' '+STONE_NAMES[4]+':'+stoneN(4),W/2,259,PAL.gold2,8,'center');
    txt('B 切换 · A 炼制 · C 返回',W/2,H-16,PAL.dim,9,'center');
  }

/* ---- BAG（按分类浏览全部物品：药品/材料含稀有度配色，魔石/道具） ---- */
let bagIdx=0;
function bagList(){
  const L=[];
  for(const id in state.pbag){const c=state.pbag[id];if(c>0){const p=POTIONS[id];const ir=p.ir!=null?p.ir:0;L.push({cat:'药品',name:p.n,c:IRARITY[ir].c,count:c});}}
  for(const id in state.mbag){const c=state.mbag[id];if(c>0){const m=MATERIALS[id];const ir=m.ir||0;L.push({cat:'材料',name:m.n,c:IRARITY[ir].c,count:c});}}
  for(let i=1;i<=4;i++){const sc=stoneN(i);if(sc>0)L.push({cat:'魔石',name:STONE_NAMES[i],c:STONE_C[i],count:sc});}
  [['orbs','捕捉球'],['seals','封印卡'],['herbs','月光草'],['mats','兽骨'],['crystals','魔晶'],['potions','体力药水']].forEach(([k,n])=>{if(state[k]>0)L.push({cat:'道具',name:n,c:'#cfc0e0',count:state[k]});});
  if(!L.length)L.push({cat:'—',name:'背包空空如也',c:PAL.dim,count:0});
  return L;
}
SCENES.BAG={
  onBtn(b){const L=bagList();if(b==='A'||b==='B'){bagIdx=(bagIdx+1)%L.length;SFX.move();}else if(b==='C'){state.scene='CITY';cityMode='map';SFX.cancel();}},
  update(){},
  draw(){
    px(0,0,W,H,PAL.bg);
    frameBox(10,10,W-20,H-50,'背 包');
    const L=bagList();if(bagIdx>=L.length)bagIdx=0;
    const it=L[bagIdx];
    box(20,30,W-40,18,'rgba(40,30,70,.9)',PAL.gold2);txt('分类：'+it.cat+'　（药品20种 / 材料40种 含 普通·稀有·史诗·传说 稀有度）',W/2,43,PAL.gold2,8,'center');
    box(W/2-30,52,60,60,'#241d40',PAL.gold2);
    txt(it.name[0],W/2,92,it.c,28,'center',true);
    txt(it.name,W/2,130,it.c,13,'center',true);
    txt('数量 × '+it.count,W/2,150,PAL.gold,12,'center');
    const tot=(state.pbag?Object.values(state.pbag).reduce((a,b)=>a+b,0):0)+(state.mbag?Object.values(state.mbag).reduce((a,b)=>a+b,0):0);
    txt('已收集 药品'+(Object.keys(state.pbag).length)+'/20 · 材料'+(Object.keys(state.mbag).length)+'/40',W/2,176,PAL.dim,8,'center');
    txt('( '+(bagIdx+1)+' / '+L.length+' )',W/2,206,PAL.dim,9,'center');
    txt('A/B 切换物品 · C 返回',W/2,H-16,PAL.dim,9,'center');
  }
};

/* ---- DEX (魔物图鉴) ---- */
let dexIdx=0;
SCENES.DEX={
  onBtn(b){
    if(b==='B'){dexIdx=(dexIdx+1)%DEXORDER.length;SFX.move();}
    else if(b==='A'){
      const t=DEXORDER[dexIdx];const bd=ENEMY[t];
      if(!state.dex.seen[t]){toast('尚未发现该魔物','#ff9');return;}

      else toast('该魔物无法被收服','#ff9');
    }
    else if(b==='C'){state.scene='CITY';cityMode='map';SFX.cancel();}
  },
  update(){},
  draw(){
    px(0,0,W,H,PAL.bg);drawTownBg('.6');px(0,0,W,H,'rgba(10,7,24,.55)');
    frameBox(10,10,W-20,H-50,'魔 物 图 鉴');
    const seenN=Object.keys(state.dex.seen).length,total=DEXORDER.length,caughtN=Object.keys(state.dex.caught).length;
    txt('已收录 '+seenN+'/'+total+' 种 · 已收服 '+caughtN,W/2,28,PAL.gold,9,'center');
    const t=DEXORDER[dexIdx];const bd=ENEMY[t];const seenFlg=state.dex.seen[t]>0;
    box(W/2-34,36,68,58,'rgba(20,15,40,.9)',seenFlg?PAL.gold2:PAL.frame);
    if(seenFlg)drawMob(t,W/2,90,performance.now()/200);
    else txt('?',W/2,84,'#555',28,'center',true);
    txt(seenFlg?bd.n:'？？？（尚未发现）',W/2,106,seenFlg?'#fff':PAL.dim,13,'center',true);
    if(seenFlg){
      const cap=bd.cap||{tool:'orb'};const tool=cap.tool==='seal'?'封印卡':'捕捉球';
      const req=!bd.capturable?'不可捕捉':('用'+tool+(cap.hp?('（血<'+Math.round(cap.hp*100)+'%）'):''));
      txt(bd.capturable?('可捕捉 · '+req):'不可捕捉',W/2,124,bd.capturable?PAL.green:'#ff9',9,'center');
      txt('出没：'+speciesZones(t),W/2,140,PAL.dim,8,'center');
      txt('天赋技能：'+(bd.skills||[]).map(s=>SKILLS[s].n).join('、'),W/2,158,PAL.pink,8,'center');
      txt('特性池：'+(bd.traits||[]).map(s=>TRAITS[s].n).join('、'),W/2,172,PAL.green,8,'center');
      if(bd.evo)txt('进化：Lv'+bd.evo.lvl+' → '+bd.n+bd.evo.title,W/2,188,PAL.gold2,8,'center');
      else txt('进化：无',W/2,188,PAL.dim,8,'center');
      txt(bd.dex,W/2,206,PAL.dim,8,'center');
    }
    if(state.dex.caught[t])txt('已收服 '+state.dex.caught[t]+' 只',W/2,224,PAL.gold,8,'center');
    txt((dexIdx+1)+' / '+DEXORDER.length,W/2,268,PAL.dim,8,'center');
    txt('B 切换 · A 查看捕捉条件 · C 返回',W/2,H-16,PAL.dim,8,'center');
  }
};

/* ---- MENU ---- */
let menuIdx=0;
const MENUITEMS=[
  {label:()=>'自动战斗：'+(state.autoMode?'开':'关'),act(){state.autoMode=!state.autoMode;save();toast('自动战斗 '+(state.autoMode?'开':'关'));}},
  {label:()=>'自动捕捉：'+(state.autoCapture?'开':'关')+'（挂机）',act(){state.autoCapture=!state.autoCapture;save();toast('挂机自动捕捉 '+(state.autoCapture?'开：虚弱自动扔球/卡':'关：不消耗捕捉道具'));}},
  {label:()=>'音效：'+(state.sound?'开':'关'),act(){state.sound=!state.sound;if(state.sound){SFX.init();startBGM();}toast('音效 '+(state.sound?'开':'关'));}},
  {label:()=>'难度：'+diffC().n+(state.diff===1?'（默认）':''),act(){state.diff=(state.diff+1)%DIFFS.length;save();toast('战斗难度 → '+diffC().n+'（怪物与 BOSS 更强、受伤更重）');}},
  {label:()=>'导出存档',act(){exportSave();}},
  {label:()=>'导入存档',act(){importSave();}},
  {label:()=>'重新开始',act(){if(confirm('确定清空当前进度？')){localStorage.removeItem('mage_save_v1');state=newState();state.scene='NAME';cityMode='map';toast('已重置');}}}
];
SCENES.MENU={
  onBtn(b){
    if(b==='A'){SFX.confirm();MENUITEMS[menuIdx].act();}
    else if(b==='B'){menuIdx=(menuIdx+1)%MENUITEMS.length;SFX.move();}
    else if(b==='C'){state.scene='CITY';cityMode='map';SFX.cancel();}
  },
  update(){},
  draw(){
    px(0,0,W,H,PAL.bg);
    frameBox(10,10,W-20,H-50,'系 统');
    MENUITEMS.forEach((m,i)=>{const sel=i===menuIdx;const y=28+i*34;box(20,y,W-40,30,sel?'#33285c':'#241d40',sel?PAL.gold:PAL.frame);
      txt(m.label(),30,y+19,'#fff',11,'left',true);txt(sel?'A ▶':'',W-28,y+19,PAL.gold,11,'right',true);});
    txt('B 切换 · A 执行 · C 返回',W/2,H-16,PAL.dim,9,'center');
  }
};

/* ---- PROMOTE ---- */
let promoT=0;
SCENES.PROMOTE={
  onBtn(b){
    if(b==='A'){state.rank++;state.kills=0;state.hp=state.maxHp;state.mp=state.maxMp;save();state.scene='CITY';cityMode='map';SFX.level();toast('晋升为 '+RANKS[state.rank]+'！','#ffd93d');}

    px(0,0,W,H,'#0a0818');

    for(let i=0;i<30;i++)px(((i*47+promoT*30)%W),((i*53)%H),1,1,'#ffd93d');

    txt(state.name,W/2,140,'#fff',13,'center',true);
    txt(RANKS[state.rank]+' →',W/2,166,PAL.dim,11,'center');
    txt(RANKS[state.rank+1],W/2,188,PAL.gold,15,'center',true);
    txt('「试炼已足，魔法帝之路又近一步」',W/2,232,PAL.dim,9,'center');
    box(W/2-60,256,120,34,'#241d40',PAL.gold);
    txt('A 接受晋升',W/2,278,'#fff',12,'center',true);

/* ---- export / import ---- */
function exportSave(){try{const data=JSON.stringify(state);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='mage-save.json';a.click();URL.revokeObjectURL(url);toast('存档已导出');}catch(e){toast('导出失败','#ff6b6b');}}
function importSave(){try{const inp=document.createElement('input');inp.type='file';inp.accept='.json';inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const s=JSON.parse(r.result);state=normalizeState(s);state.scene='CITY';cityMode='map';save();toast('导入成功：'+state.name);}catch(e){toast('文件损坏','#ff6b6b');}};r.readAsText(f);};inp.click();}catch(e){toast('导入失败','#ff6b6b');}}

/* ---- main loop ---- */
let last=performance.now(),lastErr=null,lastErrT=0;
function loop(ts){
  try{
    const dt=Math.min(0.05,(ts-last)/1000||0);last=ts;
    const s=SCENES[state?state.scene:'TITLE'];
    if(s){if(s.update)s.update(dt);if(s.draw)s.draw();}
    drawOverlay();
  }catch(err){lastErr=err;lastErrT=performance.now();console.error(err);}
  requestAnimationFrame(loop);
}
function drawOverlay(){/* 错误直接画在屏上（6 秒后自动消失，避免旧错误横幅赖着不走） + 全场景可见的提示条 */
  let y=H-36;
  /* 底部通道规则：伙伴页模态菜单/放生确认打开时，toast 自动让位不绘制，防止压住菜单选项 */
  const modal=state&&state.scene==='PARTNERS'&&(partMenuOpen||partRelConf);
  if(state&&state.scene!=='BATTLE'&&!modal){for(let i=toasts.length-1;i>=0;i--){const t=toasts[i];ctx.globalAlpha=clamp(t.t/0.4,0,1);box(8,y-12,W-16,16,'rgba(10,8,20,.92)',PAL.frame);txt(t.msg,W/2,y,t.c||'#fff',9,'center',true);ctx.globalAlpha=1;y-=20;}}
  /* 战利品结算面板：宝箱/采集/副本通关后展示具体获得了什么 */
  if(bt&&bt.lootShow&&state.scene==='BATTLE'){const L=bt.lootShow;const a=clamp(L.t/0.35,0,1);const ph=26+L.lines.length*13+8;
    ctx.globalAlpha=a;box(28,54,W-56,ph,'rgba(14,10,30,.94)',PAL.gold);
    txt(L.title,W/2,70,'#ffe9b0',10,'center',true);
    L.lines.forEach((ln,i)=>{const s=typeof ln==='string'?ln:ln.s;const c=typeof ln==='string'?'#fff':ln.c;txt(s,W/2,86+i*13,c,9,'center',true);});
    ctx.globalAlpha=1;}
  if(lastErr&&performance.now()-lastErrT<6000){box(4,26,W-8,15,'rgba(120,10,10,.88)','#ff5555');txt(('⚠ '+(lastErr.message||lastErr)).slice(0,40),W/2,37,'#ffdddd',7,'center');}
}

/* ---- input ---- */
function press(b){
  SFX.init();if(!bgmTimer&&state&&state.sound)startBGM();
  if(!state)return;
  const s=SCENES[state.scene];if(s&&s.onBtn)s.onBtn(b);
}
document.addEventListener('keydown',e=>{
  if(e.repeat)return;
  if(e.code==='KeyZ'||e.code==='Enter')press('A');
  else if(e.code==='KeyX'||e.code==='ArrowRight'||e.code==='ArrowDown')press('B');
  else if(e.code==='KeyC'||e.code==='Escape'||e.code==='ArrowLeft'||e.code==='ArrowUp')press('C');
});
const bA=document.getElementById('btnA'),bB=document.getElementById('btnB'),bC=document.getElementById('btnC');
function bind(btn,b){btn.addEventListener('touchstart',e=>{e.preventDefault();press(b);},{passive:false});btn.addEventListener('click',e=>{e.preventDefault();press(b);});}
bind(bA,'A');bind(bB,'B');bind(bC,'C');

/* ---- boot ---- */
state=newState();state.scene='TITLE';
loadAssets();
requestAnimationFrame(loop);
</script>
