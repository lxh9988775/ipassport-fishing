# ============================================================================
# 云端自动编译：把钓鱼游戏代码变成能上传社区的固件 (FoloToy-AI-Passport-full.bin)
# 触发条件：推送代码到 main/master 分支，或在 GitHub 网页手动点 "Run workflow"
# 编译完成后，去 GitHub 仓库的 Actions 页面 → 本次运行 → Artifacts 下载固件
# ============================================================================
name: Build Fishing Firmware

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # 允许在 GitHub 网页手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 用 ESP-IDF v5.5.3 编译
        uses: espressif/idf-action@v1
        with:
          version: "v5.5.3"
          command: |
            idf.py set-target esp32c3
            idf.py build
            idf.py merge-bin -o build/FoloToy-AI-Passport-full.bin

      - name: 上传固件到可下载区
        uses: actions/upload-artifact@v4
        with:
          name: fishing-firmware
          path: build/FoloToy-AI-Passport-full.bin
