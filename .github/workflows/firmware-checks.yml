name: Firmware checks

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "plays/**"
      - "skills/**"
      - "*.md"
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "plays/**"
      - "skills/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: ESP-IDF 5.5.3 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Restore ccache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ccache
          key: ci-ccache-${{ github.sha }}
          restore-keys: |
            ci-ccache-

      - name: Build and verify merged firmware
        uses: espressif/esp-idf-ci-action@9d38657f3d789ca759b2b37aaf5ceffbc42c4f0d # v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          extra_docker_args: >-
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache
            -e IDF_CCACHE_ENABLE=1
          command: ./tools/validate.sh --firmware

      - name: Upload verified firmware
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: firmware-${{ github.run_id }}
          path: build/FoloToy-AI-Passport-full.bin
          if-no-files-found: error
          retention-days: 7

      # 把编译好的整镜像提交到 build-artifacts 分支，
      # 这样即使 github.com 网页打不开，也能用 git 直接把 .bin 取回本地。
      - name: Publish firmware to build-artifacts branch
        run: |
          set -eu
          cp build/FoloToy-AI-Passport-full.bin /tmp/firmware.bin
          ls -lh /tmp/firmware.bin
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan build-artifacts
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 -not -name .git -exec rm -rf {} + 2>/dev/null || true
          cp /tmp/firmware.bin FoloToy-AI-Passport-full.bin
          git add -f FoloToy-AI-Passport-full.bin
          git commit -m "firmware build ${GITHUB_RUN_ID} from ${GITHUB_SHA}"
          git push --force origin HEAD:build-artifacts
