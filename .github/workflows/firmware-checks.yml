name: Firmware checks

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "plays/**"
      - "skills/**"
      - "*.md"
  push:
    branches:
      - main
      # 钓鱼 play（社区 733）专用构建线。
      # 本仓 main 已只编电子宠物（口袋兔，社区 948），钓鱼源码留在 fishing-app 分支上，
      # 两条线各自出各自的整镜像；这个分支不往 main 合。
      - fishing-app
    paths-ignore:
      - "docs/**"
      - "plays/**"
      - "skills/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    name: ESP-IDF 5.5.3 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Restore ccache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .ccache
          key: ci-ccache-${{ github.sha }}
          restore-keys: |
            ci-ccache-

      - name: Build and verify merged firmware
        run: |
          set -o pipefail
          mkdir -p .ccache
          docker run --rm \
            -e IDF_TARGET=esp32c3 \
            -e CCACHE_DIR=/app/${{ github.repository }}/.ccache \
            -e IDF_CCACHE_ENABLE=1 \
            -v "${GITHUB_WORKSPACE}:/app/${{ github.repository }}" \
            -w "/app/${{ github.repository }}" \
            espressif/idf:v5.5.3 \
            /bin/bash -c 'git config --global --add safe.directory "*" && ./tools/validate.sh --firmware' 2>&1 | tee /tmp/build.log

      - name: Upload verified firmware
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: firmware-${{ github.run_id }}
          path: build/FoloToy-AI-Passport-full.bin
          if-no-files-found: error
          retention-days: 7

      # 把编译好的整镜像提交到 build-artifacts 分支，
      # 这样即使 github.com 网页打不开，也能用 git 直接把 .bin 取回本地。
      - name: Publish firmware to build-artifacts branch
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          rm -rf /tmp/fwrepo && mkdir -p /tmp/fwrepo && cd /tmp/fwrepo
          git init -q .
          cp "${GITHUB_WORKSPACE}/build/FoloToy-AI-Passport-full.bin" FoloToy-AI-Passport-full.bin
          ls -lh FoloToy-AI-Passport-full.bin
          git add -f FoloToy-AI-Passport-full.bin
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "firmware build ${GITHUB_RUN_ID} from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:build-artifacts

      # 无论成功失败都把构建日志推送到 ci-logs 分支，网页打不开时也能排查
      - name: Publish build log to ci-logs branch
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          if [ -f /tmp/build.log ]; then cp /tmp/build.log /tmp/ci-log.txt; else echo "(no build log captured)" > /tmp/ci-log.txt; fi
          tail -c 150000 /tmp/ci-log.txt > /tmp/ci-log-trim.txt
          rm -rf /tmp/logrepo && mkdir -p /tmp/logrepo && cd /tmp/logrepo
          git init -q .
          cp /tmp/ci-log-trim.txt build-log.txt
          git add -f build-log.txt
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "build log ${GITHUB_RUN_ID} (${GITHUB_SHA})"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ci-logs
